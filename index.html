<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کتاب‌خوان جزوات دانشگاه امام محمد باقر (ع) ساری - نیمسال اول ۱۴۰۵</title>
    <!-- فونت فارسی وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- کتابخانه تبدیل Markdown به HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-body: #f4efe6;
            --bg-page: #fdfaf6;
            --bg-sidebar: #ebe4d8;
            --text-main: #2c2623;
            --text-muted: #6e655f;
            --accent: #8c5a32;
            --border: #dcd3c2;
            --font-size: 18px;
        }

        [data-theme="dark"] {
            --bg-body: #181a1b;
            --bg-page: #222526;
            --bg-sidebar: #1c1e1f;
            --text-main: #e4e2dd;
            --text-muted: #9e9689;
            --accent: #d49a6a;
            --border: #363a3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* نوار کناری (فهرست کتاب) */
        .sidebar {
            width: 330px;
            background-color: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 20;
        }

        .sidebar-header {
            padding: 18px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .sidebar-header h1 {
            font-size: 1.05rem;
            color: var(--accent);
            line-height: 1.6;
        }

        .search-box {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border);
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-page);
            color: var(--text-main);
            font-family: inherit;
        }

        .toc {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        details.folder-group {
            margin-bottom: 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            overflow: hidden;
        }

        details.folder-group summary {
            padding: 10px 12px;
            font-weight: bold;
            color: var(--accent);
            cursor: pointer;
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.92rem;
            user-select: none;
        }

        details.folder-group summary::-webkit-details-marker {
            display: none;
        }

        .folder-items {
            list-style: none;
            padding: 6px 10px 10px 10px;
            border-top: 1px solid var(--border);
        }

        .toc-item {
            padding: 8px 10px;
            margin-top: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            color: var(--text-main);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-word;
            direction: auto;
        }

        .toc-item:hover, .toc-item.active {
            background-color: var(--accent);
            color: #fff;
        }

        /* بخش اصلی صفحه کتاب */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar {
            height: 55px;
            background-color: var(--bg-page);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn:hover {
            background: var(--accent);
            color: #fff;
        }

        .book-viewport {
            flex: 1;
            overflow-y: auto;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
        }

        .book-page {
            background-color: var(--bg-page);
            width: 100%;
            max-width: 850px;
            min-height: 100%;
            padding: 45px 50px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--border);
            font-size: var(--font-size);
            line-height: 2;
            height: fit-content;
            overflow-wrap: break-word;
            direction: auto;
        }

        .book-page h1, .book-page h2, .book-page h3, .book-page h4 {
            color: var(--accent);
            margin-top: 1.4em;
            margin-bottom: 0.6em;
            line-height: 1.4;
        }

        .book-page p {
            margin-bottom: 1.2em;
        }

        .book-page img {
            max-width: 100%;
            border-radius: 6px;
            display: block;
            margin: 20px auto;
        }

        .book-page pre {
            background: #282c34;
            color: #abb2bf;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            direction: ltr;
            text-align: left;
            margin: 15px 0;
            font-size: 0.9em;
        }

        .book-page code {
            font-family: monospace;
            background: rgba(140, 90, 50, 0.12);
            padding: 2px 6px;
            border-radius: 4px;
            direction: ltr;
            display: inline-block;
        }

        .book-page pre code {
            background: none;
            padding: 0;
        }

        .book-page table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .book-page th, .book-page td {
            border: 1px solid var(--border);
            padding: 10px;
        }

        .pdf-frame {
            width: 100%;
            height: 75vh;
            border: none;
            border-radius: 6px;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                right: 0;
                top: 0;
                bottom: 0;
                transform: translateX(100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .book-page {
                padding: 25px 18px;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>📚 جزوات نیمسال اول ۱۴۰۵<br><small>دانشگاه امام محمد باقر (ع) ساری</small></h1>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="جستجو در نام درس یا جزوه..." oninput="filterTOC()">
        </div>
        <div class="toc" id="toc">در حال دریافت پوشه‌ها و جزوات...</div>
    </aside>

    <div class="main-container">
        <header class="toolbar">
            <div class="toolbar-group">
                <button class="btn" onclick="toggleSidebar()">☰ فهرست دروس</button>
                <span id="currentTitle" style="font-weight: bold; font-size: 0.9rem;">صفحه اصلی</span>
            </div>
            <div class="toolbar-group">
                <button class="btn" onclick="changeFontSize(2)">A+</button>
                <button class="btn" onclick="changeFontSize(-2)">A-</button>
                <button class="btn" onclick="toggleTheme()">🌙 / ☀️</button>
            </div>
        </header>

        <main class="book-viewport" id="viewport">
            <article class="book-page" id="pageContent">
                <h2>در حال بارگذاری کتاب‌خوان... 📖</h2>
            </article>
        </main>
    </div>

    <script>
        const REPO_OWNER = 'alihamidi85';
        const REPO_NAME = 'Imam-Mohammad-Baqir-University-Sari-First-Semester-1405';
        const BRANCH = 'main';
        let allFiles = [];
        let currentIndex = -1;
        let currentFontSize = 18;

        // انکود کردن دقیق مسیرهایی که فاصله و پرانتز دارند
        function encodeGitHubPath(path) {
            return path.split('/').map(segment => encodeURIComponent(segment)).join('/');
        }

        async function fetchRepoFiles() {
            const tocElement = document.getElementById('toc');
            try {
                const treeRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`);
                if (!treeRes.ok) throw new Error('خطا در اتصال به API گیت‌هاب');
                const treeData = await treeRes.json();

                // گرفتن تمام فایل‌ها (حتی فایل‌های بدون پسوند داخل پوشه‌ها)
                allFiles = treeData.tree.filter(item => 
                    item.type === 'blob' && 
                    item.path.toLowerCase() !== 'index.html' &&
                    !item.path.split('/').some(part => part.startsWith('.'))
                ).map(item => {
                    const parts = item.path.split('/');
                    const fileName = parts.pop();
                    const folderName = parts.length > 0 ? parts.join(' / ') : 'عمومی (صفحه اصلی)';
                    return {
                        path: item.path,
                        name: fileName,
                        folder: folderName,
                        rawUrl: `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${encodeGitHubPath(item.path)}`,
                        githubUrl: `https://github.com/${REPO_OWNER}/${REPO_NAME}/blob/${BRANCH}/${encodeGitHubPath(item.path)}`
                    };
                });

                renderTOC(allFiles);

                const readmeIndex = allFiles.findIndex(f => f.name.toLowerCase() === 'readme.md');
                if (readmeIndex !== -1) {
                    loadFile(readmeIndex);
                } else if (allFiles.length > 0) {
                    loadFile(0);
                }
            } catch (err) {
                tocElement.innerHTML = `<p style="color:red; padding:10px;">خطا در خواندن پوشه‌ها: ${err.message}</p>`;
            }
        }

        function renderTOC(files) {
            const tocElement = document.getElementById('toc');
            tocElement.innerHTML = '';

            if (files.length === 0) {
                tocElement.innerHTML = '<p>هیچ فایلی یافت نشد.</p>';
                return;
            }

            const grouped = {};
            files.forEach((file) => {
                const realIndex = allFiles.indexOf(file);
                if (!grouped[file.folder]) grouped[file.folder] = [];
                grouped[file.folder].push({ ...file, index: realIndex });
            });

            for (const folder in grouped) {
                const details = document.createElement('details');
                details.className = 'folder-group';
                details.open = true; // به صورت پیش‌فرض باز باشد تا تمام جزوات دیده شوند

                const summary = document.createElement('summary');
                summary.innerHTML = `<span>📁 ${folder}</span> <small>(${grouped[folder].length})</small>`;
                details.appendChild(summary);

                const ul = document.createElement('ul');
                ul.className = 'folder-items';

                grouped[folder].forEach(file => {
                    const li = document.createElement('li');
                    li.className = `toc-item ${file.index === currentIndex ? 'active' : ''}`;
                    li.id = `toc-item-${file.index}`;
                    
                    let icon = '📖';
                    if (/\.pdf$/i.test(file.name)) icon = '📕';
                    else if (/\.(png|jpg|jpeg|webp|gif)$/i.test(file.name)) icon = '🖼️';

                    li.innerHTML = `${icon} <span>${file.name}</span>`;
                    li.onclick = () => loadFile(file.index);
                    ul.appendChild(li);
                });

                details.appendChild(ul);
                tocElement.appendChild(details);
            }
        }

        async function loadFile(index) {
            currentIndex = index;
            const file = allFiles[index];
            const pageContent = document.getElementById('pageContent');
            document.getElementById('currentTitle').innerText = `${file.folder} / ${file.name}`;

            document.querySelectorAll('.toc-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById(`toc-item-${index}`);
            if (activeItem) activeItem.classList.add('active');

            pageContent.innerHTML = '<p>⏳ در حال بارگذاری محتوای جزوه...</p>';
            document.getElementById('viewport').scrollTop = 0;

            const ext = file.name.includes('.') ? file.name.split('.').pop().toLowerCase() : '';
            let contentHTML = '';

            try {
                if (ext === 'pdf') {
                    const pdfViewerUrl = `https://docs.google.com/gview?url=${encodeURIComponent(file.rawUrl)}&embedded=true`;
                    contentHTML = `
                        <p style="margin-bottom:15px;">
                            <a href="${file.rawUrl}" target="_blank" class="btn" style="text-decoration:none;">📥 دانلود فایل PDF</a>
                        </p>
                        <iframe class="pdf-frame" src="${pdfViewerUrl}"></iframe>
                    `;
                } 
                else if (['png', 'jpg', 'jpeg', 'webp', 'gif'].includes(ext)) {
                    contentHTML = `<img src="${file.rawUrl}" alt="${file.name}">`;
                } 
                else {
                    // خواندن محتوای فایل (حتی اگر بدون پسوند باشد)
                    const res = await fetch(file.rawUrl);
                    const buffer = await res.arrayBuffer();
                    const bytes = new Uint8Array(buffer.slice(0, 4));
                    const header = String.fromCharCode(...bytes);

                    // تشخیص خودکار در صورتی که فایل بدون پسوند در واقع PDF باشد
                    if (header === '%PDF') {
                        const pdfViewerUrl = `https://docs.google.com/gview?url=${encodeURIComponent(file.rawUrl)}&embedded=true`;
                        contentHTML = `
                            <p style="margin-bottom:15px;">
                                <a href="${file.rawUrl}" target="_blank" class="btn" style="text-decoration:none;">📥 دانلود فایل PDF</a>
                            </p>
                            <iframe class="pdf-frame" src="${pdfViewerUrl}"></iframe>
                        `;
                    } else {
                        const decoder = new TextDecoder('utf-8');
                        const text = decoder.decode(buffer);
                        // رندر کردن تمام فایل‌های متنی و بدون پسوند با Markdown تا مثل کتاب خوانا شوند
                        contentHTML = marked.parse(text);
                    }
                }
            } catch (e) {
                contentHTML = `<p style="color:red;">خطا در بارگذاری این جزوه. <a href="${file.githubUrl}" target="_blank">مشاهده مستقیم در گیت‌هاب</a></p>`;
            }

            contentHTML += `
                <div class="pagination">
                    ${index > 0 ? `<button class="btn" onclick="loadFile(${index - 1})">➔ جزوه قبلی (${allFiles[index - 1].name})</button>` : '<span></span>'}
                    ${index < allFiles.length - 1 ? `<button class="btn" onclick="loadFile(${index + 1})">جزوه بعدی (${allFiles[index + 1].name}) ⬅</button>` : '<span></span>'}
                </div>
            `;

            pageContent.innerHTML = contentHTML;

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function filterTOC() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allFiles.filter(f => f.path.toLowerCase().includes(q));
            renderTOC(filtered);
        }

        function changeFontSize(delta) {
            currentFontSize = Math.min(Math.max(14, currentFontSize + delta), 30);
            document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
        }

        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        fetchRepoFiles();
    </script>
</body>
</html>
